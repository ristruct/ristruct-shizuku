apply plugin: 'com.android.library'
apply plugin: 'com.kezong.fat-aar'

android {
    namespace 'com.sketchgdx.gamelib'
    compileSdk 34

    defaultConfig {
        // Android 7.0 (API 24) and up, per your requirement.
        // Note: Sketchware Pro's own "-minApi26" build variant is what's
        // needed for Kotlin support in the IDE itself, but this library's
        // own floor is 24 so it also works with plain-Java "-minApi21"
        // Sketchware Pro projects as long as *their* app minSdk is >= 24.
        minSdk 24
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Natives get copied here by copyAndroidNatives (see below) and are
    // packaged straight into the final AAR, which is what makes the AAR
    // "self contained" so Sketchware Pro doesn't need to resolve anything.
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations {
    natives
}

dependencies {
    // 'embed' comes from the fat-aar plugin: these classes get merged
    // directly into gdxgamelib's own classes.jar inside the output AAR.
    embed "com.badlogicgames.gdx:gdx:$gdxVersion"
    embed "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Same trick the official libGDX android template uses: unpack the
// natives jars straight into libs/<abi>/ so they end up inside jniLibs.
task copyAndroidNatives {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach {
    it.dependsOn(copyAndroidNatives)
}
preBuild.dependsOn(copyAndroidNatives)
