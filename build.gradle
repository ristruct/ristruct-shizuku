buildscript {
    repositories {
        google()
        // repo.maven.apache.org (what mavenCentral() resolves to) has been
        // intermittently returning 403 Forbidden to GitHub Actions runner
        // IPs. Pointing straight at the repo1 mirror avoids that CDN edge.
        maven { url 'https://repo1.maven.org/maven2' }
        mavenCentral()
        gradlePluginPortal()
        maven {
            url 'https://jitpack.io'
            content { includeGroup("com.github.aasitnikov") }
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.4"
        // Original kezong/fat-aar (1.3.8) does NOT work with AGP 8+:
        // com.android.build.api.transform was removed in AGP 8.0, which
        // breaks it. This is a maintained fork with AGP 8.5 / Gradle 8.7
        // support (https://github.com/aasitnikov/fat-aar-android).
        classpath "com.github.aasitnikov:fat-aar-android:1.4.1"
    }
}

allprojects {
    repositories {
        google()
        maven { url 'https://repo1.maven.org/maven2' }
        mavenCentral()
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
}
