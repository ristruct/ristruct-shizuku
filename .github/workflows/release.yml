name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Compile
        run: |
          gradle :library:clean :library:compileReleaseAidl :library:compileReleaseJavaWithJavac --stacktrace --warning-mode all

      - name: Unit tests
        run: |
          gradle :library:test --stacktrace --warning-mode all

      - name: Assemble release AAR
        run: |
          gradle :library:assembleRelease --stacktrace --warning-mode all

      - name: Lint report
        continue-on-error: true
        run: |
          gradle :library:lintRelease --stacktrace --warning-mode all

      - name: Export Sketchware package
        run: |
          bash scripts/export-sketchware.sh

      - name: Checksums
        run: |
          sha256sum \
            dist/RistructShizuku.zip \
            dist/RistructShizuku.aar \
            > dist/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RistructShizuku-release
          path: dist/**

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RistructShizuku.zip
            dist/RistructShizuku.aar
            dist/checksums.txt
