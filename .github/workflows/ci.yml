name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"

      - name: Compile library
        run: |
          gradle :library:clean :library:compileReleaseAidl :library:compileReleaseJavaWithJavac --stacktrace --warning-mode all

      - name: Run unit tests
        run: |
          gradle :library:test --stacktrace --warning-mode all

      - name: Assemble release AAR
        run: |
          gradle :library:assembleRelease --stacktrace --warning-mode all

      - name: Run lint report
        continue-on-error: true
        run: |
          gradle :library:lintRelease --stacktrace --warning-mode all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RistructShizuku-AAR
          path: |
            library/build/outputs/aar/*.aar
            library/build/reports/lint-results-release.html
            library/build/reports/lint-results-release.xml
          if-no-files-found: warn
