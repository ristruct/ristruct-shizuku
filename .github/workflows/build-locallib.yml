name: Build Sketchware Pro local_libs (LibGDX)

on:
  push:
    branches: [ main ]
    paths:
      - 'androidlib/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-locallib.yml'
  workflow_dispatch:
    inputs:
      gdx_version:
        description: 'libGDX version to build (blank = use gradle.properties)'
        required: false
        default: ''
      commit_output:
        description: 'Commit result into local_libs/ on this branch'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIB_NAME: GdxLib
      BUILD_TOOLS_VERSION: 34.0.0
      COMPILE_SDK: 34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --- retry helper -------------------------------------------------
      # GitHub-hosted runner IPs occasionally get rate-limited/blocked by
      # Maven/Google repos or transient DNS/network resets. This wraps any
      # command with 5 retries + backoff instead of failing the whole job.
      - name: Install retry helper
        run: |
          cat > /usr/local/bin/retry <<'EOF'
          #!/usr/bin/env bash
          n=0
          max=5
          delay=15
          until [ "$n" -ge "$max" ]
          do
            "$@" && exit 0
            n=$((n+1))
            echo "::warning::Command failed (attempt $n/$max). Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::error::Command failed after $max attempts: $*"
          exit 1
          EOF
          chmod +x /usr/local/bin/retry

      - name: Install required build-tools / platform
        run: |
          retry sdkmanager --install "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Override libGDX version (manual dispatch only)
        if: ${{ github.event.inputs.gdx_version != '' }}
        run: |
          sed -i "s/^GDX_VERSION=.*/GDX_VERSION=${{ github.event.inputs.gdx_version }}/" gradle.properties
          cat gradle.properties

      - name: Grant execute permission to gradlew
        run: |
          if [ ! -f gradlew ]; then
            retry gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build classes.jar + extract natives
        run: retry ./gradlew :androidlib:buildLocalLib --stacktrace --no-daemon

      - name: Convert to classes.dex with d8
        run: |
          set -e
          D8="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/d8"
          OUT="androidlib/build/output"
          mkdir -p "$OUT/dex"
          "$D8" --release --min-api 21 \
            --output "$OUT/dex" \
            "$OUT/classes.jar"
          mv "$OUT/dex/classes.dex" "$OUT/classes.dex"

      - name: Assemble local_libs package
        run: |
          set -e
          SRC="androidlib/build/output"
          DEST="local_libs/${LIB_NAME}"
          rm -rf "$DEST"
          mkdir -p "$DEST/libs"

          cp "$SRC/classes.jar" "$DEST/classes.jar"
          cp "$SRC/classes.dex" "$DEST/classes.dex"

          if [ -d "$SRC/natives" ]; then
            cp -r "$SRC/natives/"* "$DEST/libs/" 2>/dev/null || true
          fi

          # Small manifest so it's obvious what/when this was built from
          cat > "$DEST/BUILD_INFO.txt" <<EOF
          Library: ${LIB_NAME}
          libGDX version: $(grep GDX_VERSION gradle.properties | cut -d= -f2)
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${GITHUB_SHA}
          EOF

          ls -la "$DEST" "$DEST/libs"

      - name: Zip local_libs for release/artifact
        run: |
          cd local_libs
          zip -r "../${LIB_NAME}-local_libs.zip" "${LIB_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIB_NAME }}-local_libs
          path: |
            local_libs/
            ${{ env.LIB_NAME }}-local_libs.zip

      - name: Commit local_libs back to repo
        if: ${{ github.event.inputs.commit_output != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add local_libs
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: rebuild local_libs/${LIB_NAME} [skip ci]"
          retry git push

      - name: Create GitHub Release with zip asset
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: locallib-${{ github.run_number }}
          name: "${{ env.LIB_NAME }} local_libs build #${{ github.run_number }}"
          files: ${{ env.LIB_NAME }}-local_libs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
