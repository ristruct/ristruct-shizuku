name: Build Sketchware Pro Shizuku Library

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: android-34
      BUILD_TOOLS: 34.0.0
      SHIZUKU_VERSION: 13.1.5
      LIB_NAME: "ShizukuRistruct 13.6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: |
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"
          echo "BT_DIR=$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/${ANDROID_PLATFORM}/android.jar" >> "$GITHUB_ENV"

      - name: Fetch Shizuku API + Provider AARs and extract classes.jar
        run: |
          mkdir -p deps
          cd deps
          # All Shizuku artifacts are published as .aar, not .jar - the classes
          # live inside each aar as an embedded classes.jar.
          for artifact in aidl shared api provider; do
            curl -fsSL -o "${artifact}.aar" \
              "https://repo1.maven.org/maven2/dev/rikka/shizuku/${artifact}/${SHIZUKU_VERSION}/${artifact}-${SHIZUKU_VERSION}.aar"
            unzip -o "${artifact}.aar" classes.jar -d "${artifact}_extracted"
            mv "${artifact}_extracted/classes.jar" "shizuku-${artifact}.jar"
          done
          # Fail loudly here instead of producing a cryptic javac error later.
          for f in shizuku-aidl.jar shizuku-shared.jar shizuku-api.jar shizuku-provider.jar; do
            unzip -tq "$f" > /dev/null || { echo "::error::$f is not a valid jar - download failed"; exit 1; }
          done

      - name: Compile Java sources
        run: |
          mkdir -p build/classes
          find src -name "*.java" > sources.txt
          javac -source 8 -target 8 \
            -classpath "$ANDROID_JAR:deps/shizuku-aidl.jar:deps/shizuku-shared.jar:deps/shizuku-api.jar:deps/shizuku-provider.jar" \
            -d build/classes \
            @sources.txt

      - name: Merge dependency classes and package classes.jar
        run: |
          mkdir -p build/merged
          cp -r build/classes/* build/merged/
          cd build/merged
          jar xf ../../deps/shizuku-aidl.jar
          jar xf ../../deps/shizuku-shared.jar
          jar xf ../../deps/shizuku-api.jar
          jar xf ../../deps/shizuku-provider.jar
          rm -rf META-INF
          mkdir -p META-INF
          printf 'Manifest-Version: 1.0\r\nCreated-By: ShizukuRistruct build\r\n\r\n' > META-INF/MANIFEST.MF
          # NOTE: intentionally NOT using `jar cf` here.
          # `jar cf` always writes explicit directory entries (com/, moe/, rikka/, ...)
          # into the central directory. The reference ShizukuMaster library that is
          # known to import/build fine on-device has ZERO directory entries in its
          # classes.jar (verified: 0 vs 11 entries). Sketchware Pro's bundled/patched
          # R8 (mod.pranav.build.R8Compiler) is the consumer on-device, and matching
          # the exact zip shape of a known-working library removes this as a variable.
          # `zip -D` (no directory entries) + `-X` (no extra timestamp fields) mirrors
          # that reference structure exactly.
          find . -type f | sed 's|^\./||' | zip -X -D -q ../classes.jar -@
          cd ../..

      - name: Verify classes.jar has no directory entries
        run: |
          DIR_ENTRIES=$(unzip -l build/classes.jar | awk '{print $4}' | grep -c '/$' || true)
          echo "Directory entries in classes.jar: $DIR_ENTRIES"
          if [ "$DIR_ENTRIES" -ne 0 ]; then
            echo "::error::classes.jar still contains directory entries"
            exit 1
          fi
          unzip -tq build/classes.jar

      - name: Convert to classes.dex with d8
        run: |
          "$BT_DIR/d8" --release --output build/ build/classes.jar

      - name: Assemble Sketchware Pro library bundle
        run: |
          mkdir -p "out/${LIB_NAME} library"
          cp build/classes.jar "out/${LIB_NAME} library/classes.jar"
          cp build/classes.dex "out/${LIB_NAME} library/classes.dex"
          cp "library-meta/ShizukuRistruct_13_6_2_component.json" "out/${LIB_NAME} library/ShizukuRistruct 13.6.2 component.json"
          cp "library-meta/shizuku_13_6_2_extended.json" "out/${LIB_NAME} library/shizuku 13.6.2.json"
          cd out
          zip -r "../${LIB_NAME} library.zip" "${LIB_NAME} library"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-sketchware-library
          path: "${{ env.LIB_NAME }} library.zip"
