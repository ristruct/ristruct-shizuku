plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ristruct.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ristruct.sample'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':library')
}
